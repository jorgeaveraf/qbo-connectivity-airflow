x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:?AIRFLOW_IMAGE must reference an immutable image}
  env_file:
    - ${AIRFLOW_ENV_FILE:-.env}
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:admin}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:?AIRFLOW_POSTGRES_USER is required}:${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}@postgres/${AIRFLOW_POSTGRES_DB:?AIRFLOW_POSTGRES_DB is required}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:?AIRFLOW_API_JWT_SECRET is required}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY is required}
    PYTHONPATH: /opt/airflow/src
    QBO_GATEWAY_BASE_URL: ${QBO_GATEWAY_BASE_URL:?QBO_GATEWAY_BASE_URL is required}
    QBO_GATEWAY_API_KEY: ${QBO_GATEWAY_API_KEY:?QBO_GATEWAY_API_KEY is required}
    AUTOMATION_GATEWAY_BASE_URL: ${AUTOMATION_GATEWAY_BASE_URL:?AUTOMATION_GATEWAY_BASE_URL is required}
    AUTOMATION_GATEWAY_API_KEY: ${AUTOMATION_GATEWAY_API_KEY:?AUTOMATION_GATEWAY_API_KEY is required}
    REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
    QBO_CHECK_MAX_ATTEMPTS: ${QBO_CHECK_MAX_ATTEMPTS:-3}
    QBO_CHECK_RETRY_DELAY_SECONDS: ${QBO_CHECK_RETRY_DELAY_SECONDS:-5}
  user: "50000:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - automation-gateway
  volumes:
    - airflow-logs:/opt/airflow/logs
    - airflow-config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:?AIRFLOW_POSTGRES_DB is required}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:?AIRFLOW_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?AIRFLOW_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  airflow-permissions:
    image: ${AIRFLOW_IMAGE:?AIRFLOW_IMAGE must reference an immutable image}
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        chown -R 50000:0 /opt/airflow/config /opt/airflow/logs
        && chmod 0775 /opt/airflow/config /opt/airflow/logs
    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-config:/opt/airflow/config
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-permissions:
        condition: service_completed_successfully
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]

  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]

volumes:
  airflow-postgres-data:
  airflow-logs:
  airflow-config:

networks:
  automation-gateway:
    external: true
    name: automation-gateway_default
