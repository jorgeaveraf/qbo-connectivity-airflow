# Include inside the qbo.headquarters.co HTTPS server block only.
location = /airflow {
    return 301 /airflow/;
}

location ^~ /airflow/ {
    # No trailing slash: Airflow receives and serves the /airflow prefix.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /airflow;

    client_max_body_size 1m;
    limit_req zone=qbo_airflow_per_ip burst=60 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
