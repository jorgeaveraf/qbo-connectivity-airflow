x-airflow-common: &airflow-common
  build: .
  image: qbo-connectivity-airflow:local
  env_file:
    - path: .env
      required: false
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-local-airflow-only}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:-local-jwt-secret-change-before-deployment}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local-api-secret-change-before-deployment}
    PYTHONPATH: /opt/airflow/src
    QBO_GATEWAY_BASE_URL: ${QBO_GATEWAY_BASE_URL:-}
    QBO_GATEWAY_API_KEY: ${QBO_GATEWAY_API_KEY:-}
    AUTOMATION_GATEWAY_BASE_URL: ${AUTOMATION_GATEWAY_BASE_URL:-}
    AUTOMATION_GATEWAY_API_KEY: ${AUTOMATION_GATEWAY_API_KEY:-}
    REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
    QBO_CHECK_MAX_ATTEMPTS: ${QBO_CHECK_MAX_ATTEMPTS:-3}
    QBO_CHECK_RETRY_DELAY_SECONDS: ${QBO_CHECK_RETRY_DELAY_SECONDS:-5}
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-local-airflow-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow} -d ${AIRFLOW_POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: ["triggerer"]
    restart: unless-stopped

volumes:
  airflow-postgres-data:
